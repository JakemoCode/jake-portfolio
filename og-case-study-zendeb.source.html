<!doctype html>
<!--
  Source for public/og-case-study-zendeb.png (link preview for /case-study/zendeb).
  Lives outside public/ so it is not deployed as a route. Same convention as
  og-card.source.html. Regenerate after edits:

    "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless=new \
      --hide-scrollbars --force-device-scale-factor=1 --window-size=1200,630 \
      --virtual-time-budget=4000 --screenshot=public/og-case-study-zendeb.png \
      "file://$PWD/og-case-study-zendeb.source.html"

  Palette matches the case study route itself (the artwork's indigo and gold),
  not the site's default light theme, so the preview looks like the page it
  opens rather than like every other link from this domain.
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="preconnect" href="https://api.fontshare.com" />
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&display=swap" rel="stylesheet" />
<link href="https://api.fontshare.com/v2/css?f[]=switzer@300,400,500&display=swap" rel="stylesheet" />
<style>
  * { margin: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; }
  .card {
    width: 1200px; height: 630px; position: relative; overflow: hidden;
    background: #10202e; display: flex; align-items: center;
    font-family: "Switzer", system-ui, sans-serif;
  }
  .copy { padding: 0 0 0 84px; max-width: 640px; position: relative; z-index: 2; }
  .eyebrow {
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 19px; letter-spacing: 0.14em; text-transform: uppercase;
    color: #d8b061; margin-bottom: 26px;
  }
  h1 {
    font-family: "Bricolage Grotesque", sans-serif; font-weight: 700;
    font-size: 66px; line-height: 1.05; letter-spacing: -0.02em; color: #f0e9dc;
  }
  .sub {
    margin-top: 24px; font-size: 24px; line-height: 1.45;
    font-weight: 300; color: #bcb3a3; max-width: 560px;
  }
  .byline {
    position: absolute; left: 84px; bottom: 54px; z-index: 2;
    font-size: 20px; color: #9a917f;
  }
  .byline b { color: #f0e9dc; font-weight: 500; }
  /* The wheel bleeds off the right edge: recognisable, not a floating sticker. */
  .wheel {
    position: absolute; right: -150px; top: 50%; transform: translateY(-50%);
    width: 620px; height: 620px; z-index: 1;
  }
  .fade {
    position: absolute; inset: 0; z-index: 1;
    background: linear-gradient(90deg, #10202e 42%, rgba(16,32,46,0.55) 68%, rgba(16,32,46,0) 88%);
  }
</style>
</head>
<body>
  <div class="card">
    <img class="wheel" src="src/assets/case-studies/nakshatra/wheel-disc.webp" alt="" />
    <div class="fade"></div>
    <div class="copy">
      <div class="eyebrow">Case study &nbsp;/&nbsp; Zendeb</div>
      <h1>Teaching a machine to have one opinion</h1>
      <div class="sub">A prompt system that held 91 illustrations together, and the interaction physics of the wheel they live on.</div>
    </div>
    <div class="byline"><b>Jake Mosher</b> &nbsp;·&nbsp; jakemosher.dev</div>
  </div>
</body>
</html>
