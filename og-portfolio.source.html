<!doctype html>
<!--
  Source for public/og-portfolio.png (the link-preview card for the root, the
  portfolio). Lives outside public/ so it is not deployed as a route. The field
  is seeded, so it draws the same every time. Regenerate after edits:

    "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless=new \
      --user-data-dir="$(mktemp -d)" --hide-scrollbars --force-device-scale-factor=1 \
      --window-size=1200,630 --virtual-time-budget=4000 \
      --screenshot=public/og-portfolio.png "file://$PWD/og-portfolio.source.html"
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Vollkorn:ital,wght@1,400&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet" />
<style>
  * { margin: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; }
  .card {
    width: 1200px; height: 630px; position: relative; overflow: hidden;
    background: linear-gradient(135deg, #041615, #06201e);
    display: flex; align-items: center;
  }
  canvas { position: absolute; inset: 0; }
  .copy { position: relative; z-index: 1; padding: 0 0 0 90px; max-width: 900px; }
  h1 {
    font-family: "Bricolage Grotesque", sans-serif; font-weight: 600;
    font-size: 104px; line-height: 1; letter-spacing: -0.035em; color: #eef6f3;
  }
  p {
    margin-top: 30px; max-width: 27ch;
    font-family: "Vollkorn", Georgia, serif; font-style: italic; font-size: 38px;
    line-height: 1.3; color: #a9c4bd;
  }
  .site {
    position: absolute; left: 90px; bottom: 56px; z-index: 1;
    font-family: "JetBrains Mono", monospace; font-weight: 500; font-size: 22px;
    color: #5ee8cf;
  }
</style>
</head>
<body>
  <div class="card">
    <canvas id="field" width="1200" height="630" aria-hidden="true"></canvas>
    <div class="copy">
      <h1>Jake Mosher</h1>
      <p>Front-end and product engineer. I hold <span style="white-space: nowrap">AI-written</span> code to the standards we set for human teammates.</p>
    </div>
    <div class="site">jakemosher.dev</div>
  </div>
  <script>
    // A still frame of the hero's field: the same grid, link reach and colors
    let seed = 7;
    const random = () => ((seed = (seed * 16807) % 2147483647) - 1) / 2147483646;
    const ctx = document.getElementById("field").getContext("2d");
    const [w, h, gap] = [1200, 630, 90];
    const rgba = (c, a) => `rgba(${c},${a})`;
    const signal = "94,232,207";
    const ember = "232,120,86";

    const veil = ctx.createRadialGradient(w * 0.82, h * 0.3, 0, w * 0.82, h * 0.3, w * 0.6);
    veil.addColorStop(0, "rgba(20,184,166,0.18)");
    veil.addColorStop(1, "rgba(20,184,166,0)");
    ctx.fillStyle = veil;
    ctx.fillRect(0, 0, w, h);

    const nodes = [];
    for (let y = -gap / 2; y < h + gap; y += gap)
      for (let x = -gap / 2; x < w + gap; x += gap)
        nodes.push({ x: x + (random() - 0.5) * gap * 0.7, y: y + (random() - 0.5) * gap * 0.7, lit: 0 });

    // Light a few nodes on the right, where no text sits, with one ember
    const lit = nodes.filter((n) => n.x > 820 && n.y > 60 && n.y < 570);
    for (let i = 0; i < 6; i++) lit[Math.floor(random() * lit.length)].lit = 0.4 + random() * 0.6;
    const hot = lit[Math.floor(random() * lit.length)];
    hot.lit = 1;
    hot.ember = true;

    // The text sits over the left, so the field fades toward it
    const fade = (x) => Math.min(1, Math.max(0.35, (x - 300) / 600));

    ctx.lineWidth = 1;
    nodes.forEach((a, i) => {
      for (let j = i + 1; j < nodes.length; j++) {
        const b = nodes[j];
        if (Math.hypot(a.x - b.x, a.y - b.y) >= gap * 1.45) continue;
        const glow = Math.max(a.lit, b.lit) * 0.5;
        const color = (a.ember || b.ember) ? ember : signal;
        ctx.strokeStyle = rgba(color, (0.09 + glow * 0.4) * fade((a.x + b.x) / 2));
        ctx.beginPath();
        ctx.moveTo(a.x, a.y);
        ctx.lineTo(b.x, b.y);
        ctx.stroke();
      }
    });

    for (const n of nodes) {
      const color = n.ember ? ember : signal;
      if (n.lit) {
        const halo = ctx.createRadialGradient(n.x, n.y, 0, n.x, n.y, 22 * n.lit + 4);
        halo.addColorStop(0, rgba(color, 0.35 * n.lit));
        halo.addColorStop(1, rgba(color, 0));
        ctx.fillStyle = halo;
        ctx.fillRect(n.x - 30, n.y - 30, 60, 60);
      }
      ctx.fillStyle = rgba(color, (0.28 + n.lit * 0.7) * fade(n.x));
      ctx.beginPath();
      ctx.arc(n.x, n.y, 1.6 + n.lit * 2.6, 0, Math.PI * 2);
      ctx.fill();
    }
  </script>
</body>
</html>
