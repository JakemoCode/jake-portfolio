vec3 mod289(vec3 x){return x-floor(x*(1.0/289.0))*289.0;}
vec4 mod289(vec4 x){return x-floor(x*(1.0/289.0))*289.0;}
vec4 permute(vec4 x){return mod289(((x*34.0)+1.0)*x);}
vec4 taylorInvSqrt(vec4 r){return 1.79284291400159-0.85373472095314*r;}
float snoise(vec3 v){
  const vec2 C=vec2(1.0/6.0,1.0/3.0); const vec4 D=vec4(0.0,0.5,1.0,2.0);
  vec3 i=floor(v+dot(v,C.yyy)); vec3 x0=v-i+dot(i,C.xxx);
  vec3 g=step(x0.yzx,x0.xyz); vec3 l=1.0-g; vec3 i1=min(g.xyz,l.zxy); vec3 i2=max(g.xyz,l.zxy);
  vec3 x1=x0-i1+C.xxx; vec3 x2=x0-i2+C.yyy; vec3 x3=x0-D.yyy;
  i=mod289(i);
  vec4 p=permute(permute(permute(i.z+vec4(0.0,i1.z,i2.z,1.0))+i.y+vec4(0.0,i1.y,i2.y,1.0))+i.x+vec4(0.0,i1.x,i2.x,1.0));
  float n_=0.142857142857; vec3 ns=n_*D.wyz-D.xzx;
  vec4 j=p-49.0*floor(p*ns.z*ns.z);
  vec4 x_=floor(j*ns.z); vec4 y_=floor(j-7.0*x_);
  vec4 x=x_*ns.x+ns.yyyy; vec4 y=y_*ns.x+ns.yyyy; vec4 h=1.0-abs(x)-abs(y);
  vec4 b0=vec4(x.xy,y.xy); vec4 b1=vec4(x.zw,y.zw);
  vec4 s0=floor(b0)*2.0+1.0; vec4 s1=floor(b1)*2.0+1.0; vec4 sh=-step(h,vec4(0.0));
  vec4 a0=b0.xzyw+s0.xzyw*sh.xxyy; vec4 a1=b1.xzyw+s1.xzyw*sh.zzww;
  vec3 p0=vec3(a0.xy,h.x); vec3 p1=vec3(a0.zw,h.y); vec3 p2=vec3(a1.xy,h.z); vec3 p3=vec3(a1.zw,h.w);
  vec4 norm=taylorInvSqrt(vec4(dot(p0,p0),dot(p1,p1),dot(p2,p2),dot(p3,p3)));

    uniform float uTime; uniform float uAmp; uniform float uSpeed;
    uniform vec2 uPointer; uniform float uReveal; uniform float uRadius; uniform float uPush;
    ${NOISE}
    void main(){
      vColor = aColor; vBase = position.xy; vSeed = aSeed; vUv = position.xy / 640.0;
      vec3 p = position;
      // summed traveling waves sampled at the tile centroid: neighbouring tiles
      // share nearly the same phase, so the whole sheet undulates as one surface.
      // centroid is shared by the 3 verts -> each tile rides the wave rigidly.
      vec2 c = aCentroid;
      vec2 disp = vec2(0.0);
      float h = 0.0;
      vec2 d1 = normalize(vec2( 1.0, 0.35)); float k1 = 6.2831853/420.0; float w1 = k1*(dot(c,d1) - 55.0*uSpeed*uTime); disp += d1*14.0*cos(w1); h += sin(w1);
      vec2 d2 = normalize(vec2( 0.4, 1.00)); float k2 = 6.2831853/300.0; float w2 = k2*(dot(c,d2) - 70.0*uSpeed*uTime); disp += d2* 9.0*cos(w2); h += sin(w2);
      vec2 d3 = normalize(vec2(-0.6, 0.55)); float k3 = 6.2831853/550.0; float w3 = k3*(dot(c,d3) - 40.0*uSpeed*uTime); disp += d3*12.0*cos(w3); h += sin(w3);
      vWave = h;
      p.xy += disp * uAmp;                    // wave-driven undulation
      // pointer parts the tiles: shove each tile's centroid away from the
      // cursor within uRadius, opening gaps that reveal the starscape behind
      vec2 toTile = c - uPointer;
      float pd = length(toTile);
      float infl = uReveal * smoothstep(uRadius, 0.0, pd);
      vec2 away = pd > 0.001 ? toTile / pd : vec2(0.0);
      p.xy += away * infl * uPush;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(p, 1.0);

  fragmentShader: `
    precision highp float;
    varying vec2 vUv; varying vec3 vColor; varying float vWave;

      // their flat color there; in-bounds tiles stay photographic
      vec2 e = step(vec2(0.0), vUv) * step(vUv, vec2(1.0));
      vec3 col = mix(vColor, tex, e.x * e.y);
      float shade = 1.0 + uLight * vWave * 0.04;
      gl_FragColor = vec4(col * shade, 1.0);
    }`,
});

                + stars(vWorld+120.0,0.090,0.050,0.93)*0.5;

  renderer.setSize(w, h);
  let left, right, top, bottom;
  if (a >= 1){ const hw = D * 0.5 * a; left = 320 - hw; right = 320 + hw; top = 0; bottom = D; }
  else       { const hh = D * 0.5 / a; left = 0; right = D; top = 320 - hh; bottom = 320 + hh; }
  bounds = { left, right, top, bottom };
  camera = new THREE.OrthographicCamera(left, right, top, bottom, -10, 10);  // top<bottom => y-down like SVG
  camera.position.z = 5;
}
resize();
addEventListener('resize', resize);

const ptr = new THREE.Vector2(-9999, -9999);   // pointer in mosaic coords
let revealTarget = 0, revealVal = 0;
addEventListener('pointermove', e => {
  ptr.x = bounds.left + (e.clientX / innerWidth)  * (bounds.right - bounds.left);
  ptr.y = bounds.top  + (e.clientY / innerHeight) * (bounds.bottom - bounds.top);
  revealTarget = 1.0;
});
addEventListener('pointerleave', () => { revealTarget = 0.0; });   // tiles spring back

function frame(){
  const up = mat.uniforms.uPointer.value;
  up.x += (ptr.x - up.x) * 0.18;                       // ease parting toward cursor
  up.y += (ptr.y - up.y) * 0.18;
  revealVal += (revealTarget - revealVal) * 0.08;
  mat.uniforms.uReveal.value = revealVal;
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
frame();
</script>
</body>
</html>
